name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
  eval-gate:
    # Skipped until the first eval set exists; then fails PRs whose pass rate drops vs. the
    # baseline committed on main. Convention: evalsets/<name>.jsonl, <name>.baseline.json,
    # and a target function at evals_targets/<name>.py:suggest.
    if: hashFiles('evalsets/resumemaster.jsonl') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: codeksnet/evals@main
        with:
          evalset: evalsets/resumemaster.jsonl
          target: evals_targets.resumemaster:suggest
          baseline: evalsets/resumemaster.baseline.json
          max-drop: "0.02"
          extras: judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  tenants-leak-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: pg }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: pg
      TENANTS_TEST_DATABASE_URL: postgresql://postgres:pg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Apply migration
        run: |
          for f in apps/tenants/supabase/ci/00_auth_stub.sql apps/tenants/supabase/migrations/*.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - run: pip install -r apps/tenants/tests/requirements.txt
      - run: pytest apps/tenants/tests -q
  events-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @codeksnet/events-infra build
      - run: pnpm --filter @codeksnet/events-infra test
  data-scraper:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: pg
      DATABASE_URL: postgresql://postgres:pg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f apps/data/supabase/migrations/0001_data.sql
      - run: pip install -e "apps/data/scraper[dev]"
      - run: ruff check apps/data/scraper
      - run: pytest apps/data/scraper -q
