name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
  eval-gate:
    # Skipped until the first eval set exists; then fails PRs whose pass rate drops vs. the
    # baseline committed on main. Convention: evalsets/<name>.jsonl, <name>.baseline.json,
    # and a target function at evals_targets/<name>.py:suggest.
    if: hashFiles('evalsets/resumemaster.jsonl') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: codeksnet/evals@main
        with:
          evalset: evalsets/resumemaster.jsonl
          target: evals_targets.resumemaster:suggest
          baseline: evalsets/resumemaster.baseline.json
          max-drop: "0.02"
          extras: judge
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
