[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labs-scraper"
version = "0.0.1"
description = "Resumable Playwright scraper with normalization, dedup and confidence scoring. Part of Codeks Labs."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["beautifulsoup4>=4.12", "playwright>=1.48", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/labs_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
